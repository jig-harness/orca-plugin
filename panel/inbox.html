    <style>
/* The panel in Orca's right sidebar, 350 px by default. Colours come from Orca's --orca-*
   frame variables; frames get no success or warning colour, so the panel mixes its own. */
:root {
  --fg: var(--orca-foreground, #0a0a0a);
  --bg: var(--orca-background, #fff);
  --mut: var(--orca-muted-foreground, #696969);
  --line: var(--orca-border, #e5e5e5);
  --card: var(--orca-card, #fff);
  --soft: var(--orca-muted, #f5f5f5);
  --primary: var(--orca-primary, #171717);
  --primary-fg: var(--orca-primary-foreground, #fafafa);
  --bad: var(--orca-destructive, #e40014);
  --warn: color-mix(in oklab, #d97706 80%, var(--fg));
  --radius: var(--orca-radius, 0.625rem);
  color-scheme: light dark;
}
html.light { color-scheme: light; }
html.dark { color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body {
  font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif;
  overflow-wrap: anywhere;
}
.m, code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.92em; }
.sm { font-size: 12px; }
.mut { color: var(--mut); }
.pad { padding: 12px; }
p { margin: 0; }

.bar {
  position: sticky; top: 0; z-index: 1;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 12px; background: var(--bg); border-bottom: 1px solid var(--line);
}
.bar #refresh { margin-left: auto; }
.bar .tab { background: transparent; border-color: transparent; font-weight: 500; color: var(--mut); }
.bar .tab[aria-pressed="true"] { color: var(--fg); background: var(--soft); border-color: var(--line); font-weight: 600; }

button {
  font: inherit; font-size: 12px; color: var(--fg); background: var(--soft);
  border: 1px solid var(--line); border-radius: calc(var(--radius) - 4px);
  padding: 3px 8px; cursor: pointer; max-width: 100%;
}
button:hover { border-color: var(--mut); }
button:focus-visible, textarea:focus-visible, summary:focus-visible {
  outline: 2px solid var(--orca-ring, #a1a1a1); outline-offset: 1px;
}
button.primary { background: var(--primary); color: var(--primary-fg); border-color: var(--primary); }
button.ghost { background: transparent; }
button.link {
  background: none; border: none; padding: 0; color: inherit;
  text-decoration: underline; text-underline-offset: 2px;
}

.band { padding: 12px; border-bottom: 1px solid var(--line); display: grid; gap: 2px; }
.band .title { font-size: 15px; font-weight: 600; }
.band.loud .title { color: var(--warn); }
.warn { color: var(--warn); font-weight: 600; }
.tick.overdue { color: var(--bad); font-weight: 600; }

.note { margin: 8px 12px 0; padding: 6px 8px; border-radius: calc(var(--radius) - 4px); background: var(--soft); }

.group { padding: 0 12px; }
.groupHead {
  margin: 14px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--mut);
}

.need, .addr {
  display: grid; gap: 4px; padding: 10px; margin-bottom: 8px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
}
.rowTop { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--warn); }
.dot.quiet { background: var(--mut); }
.tgt { font-weight: 600; }
.end { margin-left: auto; white-space: nowrap; }
.stage { color: var(--mut); }
.ttl { font-weight: 500; }
.q { font-weight: 500; }

.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

.replies { display: grid; gap: 8px; margin-top: 4px; }
.box { display: grid; gap: 4px; }
.box .acts { margin-top: 0; }
.box.confirm { padding: 6px 8px; border: 1px solid var(--line); border-radius: calc(var(--radius) - 4px); background: var(--soft); }
pre.line, pre.printed {
  margin: 0; padding: 4px 6px; white-space: pre-wrap; overflow-wrap: anywhere;
  font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
  background: var(--bg); border: 1px solid var(--line); border-radius: calc(var(--radius) - 4px);
}
pre.printed { margin-top: 4px; color: var(--mut); }
.sent b { color: var(--fg); }
.failed { color: var(--bad); }
.failed b { font-weight: 600; }

.crumb { padding: 6px 12px 0; }
.band .kv { margin-top: 6px; }
.thread { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.entry { display: grid; gap: 3px; padding-left: 8px; border-left: 2px solid var(--line); }
.entry.k-question, .entry.k-answer { border-left-color: var(--warn); }
.entry .meta { display: flex; align-items: baseline; gap: 6px; }
.entry .kind { white-space: nowrap; font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; }
/* The record's own words, set apart from Jig's: never styled as the panel's text. */
.quoted {
  margin: 0; padding: 4px 8px; white-space: pre-wrap; font-size: 12px;
  background: var(--soft); border-radius: calc(var(--radius) - 4px);
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.src .link { font-size: 11px; color: var(--mut); }
textarea {
  width: 100%; resize: vertical; font: inherit; color: var(--fg);
  background: var(--bg); border: 1px solid var(--orca-input, var(--line));
  border-radius: calc(var(--radius) - 4px); padding: 4px 6px;
}

details > summary { cursor: pointer; }
.decisions { display: grid; gap: 4px; margin-top: 4px; }
.decision { border-left: 2px solid var(--line); padding-left: 8px; }
.decision > summary { list-style-position: outside; }
.decision .q { font-size: 12px; }
.md { margin-top: 4px; display: grid; gap: 4px; font-size: 12px; }
.md h4 {
  margin: 6px 0 0; font-size: 11px; font-weight: 600; letter-spacing: 0.04em;
  text-transform: uppercase; color: var(--mut);
}
.md ul { margin: 0; padding-left: 16px; display: grid; gap: 2px; }
.md code, .kv .m { background: var(--soft); border-radius: 3px; padding: 0 3px; }

.fold > summary { color: var(--mut); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 2px 8px; margin: 4px 0 0; }
.kv dt { color: var(--mut); }
.kv dd { margin: 0; min-width: 0; }

.empty { padding: 24px 12px; display: grid; gap: 4px; text-align: center; }
.empty.bad b { color: var(--bad); }
    </style>

    <script type="module">
// panel/src/util.mjs
// What every view of the panel shares: escaping, ages in the dashboard's words, and which links
// open. Pure functions; nothing here reaches Orca.

const MINUTE_MS = 60_000

/** Text made safe to put in HTML, attributes included. */
function esc(value) {
  return String(value ?? '').replace(
    /[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]
  )
}

/** A number of whole minutes as the dashboard says it: `47 min`, `1 h 17 min`, `3 d`. */
function span(minutes) {
  const whole = Math.max(0, Math.floor(minutes))
  if (whole < 60) return `${whole} min`
  const hours = Math.floor(whole / 60)
  const rest = whole % 60
  if (hours >= 48) return `${Math.floor(hours / 24)} d`
  return `${hours} h${rest > 0 ? ` ${rest} min` : ''}`
}

/** How long ago a time was, in whole minutes; `?` when it does not read. */
function ago(iso, nowMs) {
  const at = Date.parse(iso)
  return Number.isFinite(at) ? span((nowMs - at) / MINUTE_MS) : '?'
}

/** `1 session`, `3 sessions`. */
function plural(n, one, many = `${one}s`) {
  return `${n} ${n === 1 ? one : many}`
}

/** Only the forge's or tracker's own https link opens; anything else is not a link. */
function openableUrl(url) {
  return typeof url === 'string' && /^https:\/\/[^/\s]+\//i.test(url) ? url : null
}

// panel/src/answer.mjs
// The answer box, as pure functions: one box per parked question of an address, which sends the
// person's answer through the worker's `address.send` (`jig send <address> answer <key> <text>`).
// Before it sends it shows the text and the address it goes to; after, what `jig send` printed,
// as sent or not sent. The inbox and the thread draw the same box for the same question, so a
// draft typed in one is there in the other. Drafts live only in the open page.

/** A box's key across views and reads: the address and the question's key, on two lines. */
function boxKey(address, key) {
  return `${address}\n${key}`
}

/** The line `jig send` writes for an answer, as the person reads it before sending. */
function answerLine(key, text) {
  return `answer ${key}: ${String(text ?? '').trim()}`
}

function resultHtml(send) {
  const r = send.result ?? {}
  const printed = r.printed ? `<details class="fold"><summary class="sm">What jig send printed</summary><pre class="printed">${esc(r.printed)}</pre></details>` : ''
  if (send.stage === 'sent') {
    const url = openableUrl(r.wrote)
    return `<div class="sent sm" role="status"><b>Sent.</b>${
      r.wrote ? ` Jig wrote ${url ? `<button type="button" class="link" data-open-url="${esc(url)}">the comment ↗</button>` : `<span class="m">${esc(r.wrote)}</span>`}` : ''
    }${r.writesAs ? `<div class="mut">As ${esc(r.writesAs)}.</div>` : ''}</div>${printed}`
  }
  return `<div class="failed sm" role="alert"><b>${r.unknown ? 'Delivery unknown:' : 'Not sent:'}</b> ${esc(r.why ?? 'no reason was given.')}</div>${printed}`
}

/**
 * The box for one question of `address`. `drafts` holds what was typed, by `boxKey`, and
 * `sends` each box's step: `review` (the text, shown before it is sent), `sending`, `sent` or
 * `failed`, with the worker's `result`.
 */
function questionBoxHtml(address, question, { drafts = new Map(), sends = new Map() } = {}) {
  const k = boxKey(address, question.key)
  const send = sends.get(k) ?? null
  const data = `data-address="${esc(address)}" data-key="${esc(question.key)}"`
  const head = `<span class="sm mut">Answer <span class="m">${esc(question.key)}</span>${
    question.question ? `: ${esc(question.question)}` : ''
  }</span>`
  if (send?.stage === 'review' || send?.stage === 'sending')
    return `<div class="box confirm" data-box="${esc(k)}">${head}
      <p class="sm">Sends to <span class="m">${esc(address)}</span>, through <span class="m">jig send</span>:</p>
      <pre class="line">${esc(answerLine(question.key, send.text))}</pre>
      <div class="acts">${
        send.stage === 'sending'
          ? '<span class="sm mut">Sending through jig send…</span>'
          : `<button type="button" class="primary" data-answer="send" ${data}>Send</button>
        <button type="button" class="ghost" data-answer="edit" ${data}>Edit</button>`
      }</div>
    </div>`
  if (send?.stage === 'sent')
    return `<div class="box" data-box="${esc(k)}">${head}<pre class="line">${esc(answerLine(question.key, send.text))}</pre>${resultHtml(send)}</div>`
  if (send?.result?.unknown)
    return `<div class="box" data-box="${esc(k)}">${head}<pre class="line">${esc(answerLine(question.key, send.text))}</pre>${resultHtml(send)}
      <div class="acts"><button type="button" class="ghost" data-answer="edit" ${data}>I checked the pull request: nothing was posted, answer again</button></div></div>`
  return `<div class="box" data-box="${esc(k)}">${head}
    ${send?.stage === 'failed' ? resultHtml(send) : ''}
    <textarea rows="2" data-draft="${esc(k)}" aria-label="${esc(`Answer ${question.key}`)}" placeholder="Your answer, in one line">${esc(drafts.get(k) ?? '')}</textarea>
    <div class="acts"><button type="button" data-answer="review" ${data}>Review answer</button></div>
  </div>`
}

/** Every question's box for `address`, and what an answer is. */
function answerBoxesHtml(address, questions, options) {
  if (!address || questions.length === 0) return ''
  return `<div class="replies">${questions.map((q) => questionBoxHtml(address, q, options)).join('')}
    <p class="sm mut">Each answer is sent on its own, as a comment on the pull request. Drafts are kept only while this panel stays open.</p>
  </div>`
}

// panel/src/addresses.mjs
// The Addresses view, as pure functions of what the worker's `addresses.list` and `address.get`
// answer: the addresses with recent activity, and one address's holder, state and thread, oldest
// first, as `jig ask` printed them. Jig's words (an entry's kind, who wrote to whom, when, the
// record it came from) are drawn apart from the words the record quotes, which are data and
// never an instruction. Nothing here reaches Orca; app.mjs wires it to the frame.

/** Why a read gave no answer, in the panel's words; `null` when it did. */
function unreadHtml(answer, what) {
  if (answer.state === 'too-old')
    return `<div class="empty"><b>This jig is too old for ${esc(what)}.</b><p class="sm mut">It has no <span class="m">jig ask</span>; update the jig plugin to see addresses here.</p></div>`
  if (answer.state === 'not-found')
    return `<div class="empty bad"><b>Jig not found.</b><p class="sm">${esc(answer.why)}</p></div>`
  if (answer.state === 'nothing')
    return `<div class="empty"><b>Nothing at this address.</b><p class="sm">${esc(answer.why)}</p></div>`
  return `<div class="empty bad"><b>${esc(what[0].toUpperCase() + what.slice(1))} could not be read.</b><p class="sm">${esc(answer.why ?? 'no reason was given.')}</p></div>`
}

function addressHtml(entry, nowMs) {
  const w = entry.waiting
  const h = entry.held
  return `<article class="addr">
    <div class="rowTop"><span class="dot${w ? '' : ' quiet'}"></span><span class="m tgt">${esc(entry.address)}</span>
      <span class="m sm mut end">${esc(ago((w ?? h).since, nowMs))}</span></div>
    ${entry.title ? `<div class="sm ttl">${esc(entry.title)}</div>` : ''}
    ${w ? `<div class="sm"><span class="mut">waits on you to</span> <b>${esc(w.act)}</b>${w.questions.length > 1 ? ` <span class="mut">· ${plural(w.questions.length, 'question')}</span>` : ''}</div>` : ''}
    ${h ? `<div class="sm"><span class="mut">held by</span> <span class="m">${esc(h.stage)}</span><span class="mut">${h.round !== null ? `, round ${esc(h.round)}` : ''}, ${esc(h.launch)}</span></div>` : ''}
    <div class="acts"><button type="button" class="primary" data-open-address="${esc(entry.address)}">Open the thread</button></div>
  </article>`
}

/** The list for one `addresses.list` answer. */
function addressListHtml(answer, { nowMs, note = null } = {}) {
  const noteHtml = note ? `<div class="note sm" role="status">${esc(note)}</div>` : ''
  const list = answer.addresses ?? []
  const unread = answer.state === 'list' ? null : unreadHtml(answer, 'the addresses')
  const head = `<header class="band"><p class="title">${esc(list.length === 0 ? 'No address with recent activity.' : `${plural(list.length, 'address', 'addresses')} with recent activity.`)}</p>
    <p class="sm mut">What waits on a person, from <span class="m">jig ask --waiting</span>, then what the line's sessions hold.</p>${
      answer.tick ? `\n    <p class="sm mut" title="${esc(`Tick ${answer.tick.runId}`)}">Tick finished ${esc(ago(answer.tick.finishedAt, nowMs))} ago.</p>` : ''
    }${answer.unread ? `\n    <p class="sm mut">${esc(answer.unread)}</p>` : ''}
  </header>`
  return `${head}${noteHtml}${unread ?? ''}<section class="group">${list.map((e) => addressHtml(e, nowMs)).join('')}</section>`
}

/** Who holds the station, in Jig's fields. */
function holderText(holder) {
  if (holder === 'none' || !holder) return 'none'
  const generation = Number.isInteger(holder.generation) ? `, driver generation ${holder.generation}` : ''
  return `${holder.stage}, on ${holder.host}${generation}, process ${holder.process}`
}

function waitsText(waitsOn) {
  if (waitsOn === 'none' || !waitsOn) return 'none'
  if (typeof waitsOn.waiting === 'string') return `waiting: ${waitsOn.waiting}`
  return `a person, to ${waitsOn.person}${waitsOn.why ? `: ${waitsOn.why}` : ''}`
}

/** Where an entry's record is: its link, opened on a press, or its path on this machine. */
function recordHtml(record) {
  const url = openableUrl(record?.url)
  if (url) return `<button type="button" class="link m" data-open-url="${esc(url)}" title="${esc(url)}">${esc(record.kind)} ↗</button>`
  return `<span class="m" title="${esc(record?.path ?? record?.url ?? '')}">${esc(record?.kind ?? 'record')}: ${esc(record?.path ?? record?.url ?? '')}</span>`
}

/** One entry: Jig's line about it, then the record's own words, quoted. */
function entryHtml(entry, nowMs) {
  return `<li class="entry k-${esc(entry.kind)}">
    <div class="meta sm"><span class="kind">${esc(entry.kind)}</span>
      <span class="m mut end" title="${esc(entry.at)}">${esc(ago(entry.at, nowMs))}</span></div>
    <div class="m sm mut">${esc(entry.from)} → ${esc(entry.to)}</div>
    <blockquote class="quoted">${esc(entry.text)}</blockquote>
    <div class="sm mut src">${recordHtml(entry.record)}${entry.local ? ' · this machine only' : ''}${
      entry.until ? ` · came off ${esc(ago(entry.until, nowMs))} ago` : ''
    }</div>
  </li>`
}

/**
 * One address for one `address.get` answer: its holder, state and what it waits on, an answer
 * box for each question the line has it parked on, then its thread, oldest first.
 */
function threadHtml(answer, { nowMs, drafts = new Map(), sends = new Map(), note = null } = {}) {
  const noteHtml = note ? `<div class="note sm" role="status">${esc(note)}</div>` : ''
  const back = `<div class="crumb"><button type="button" class="ghost sm" data-tab="addresses">← Addresses</button></div>`
  if (answer.state !== 'answer')
    return `${back}${answer.address ? `<p class="pad m">${esc(answer.address)}</p>` : ''}${noteHtml}${unreadHtml(answer, 'this address')}`
  const a = answer.value
  const url = openableUrl(a.url)
  const thread = Array.isArray(a.thread) ? a.thread : []
  const omitted = Number.isInteger(a.threadOmitted) ? a.threadOmitted : 0
  const unread = (a.sources?.records ?? []).filter((r) => r.read === false)
  return `${back}<header class="band">
    <p class="title m">${esc(a.address)}</p>
    ${a.title ? `<p class="sm ttl">${esc(a.title)}</p>` : ''}
    <dl class="kv sm">
      <dt>holder</dt><dd>${esc(holderText(a.holder))}</dd>
      <dt>state</dt><dd><span class="m">${esc(a.state)}</span>${a.stateDetail ? `<span class="mut">, ${esc(a.stateDetail)}</span>` : ''}</dd>
      <dt>waits on</dt><dd>${esc(waitsText(a.waitsOn))}</dd>
      ${a.last ? `<dt>last</dt><dd><span class="m">${esc(a.last.class)}</span><span class="mut">, ${esc(ago(a.last.at, nowMs))} ago: ${esc(a.last.reason)}</span></dd>` : ''}
    </dl>
    ${url ? `<div class="acts"><button type="button" data-open-url="${esc(url)}">Open the pull request ↗</button></div>` : ''}
  </header>${noteHtml}
  ${answer.parked.length > 0 ? `<section class="group"><h2 class="groupHead">To answer <span class="mut">${answer.parked.length}</span></h2>${answerBoxesHtml(a.address, answer.parked, { drafts, sends })}</section>` : ''}
  <section class="group"><h2 class="groupHead">Thread <span class="mut">${thread.length}</span></h2>
    ${omitted > 0 ? `<p class="sm mut">${esc(plural(omitted, 'earlier entry', 'earlier entries'))} left out. <button type="button" class="link" data-thread-all="${esc(a.address)}">Show all</button></p>` : ''}
    ${thread.length === 0 ? `<p class="sm mut">${omitted > 0 ? 'The correspondence was too large to display; read it with jig ask.' : unread.length > 0 ? 'No correspondence was read; some sources could not be read.' : 'No correspondence yet: no record names this address.'}</p>` : `<ol class="thread">${thread.map((e) => entryHtml(e, nowMs)).join('')}</ol>`}
    ${unread.length > 0 ? `<p class="sm mut">Not read: ${unread.map((r) => `<span class="m">${esc(r.record)}</span>${r.detail ? ` (${esc(r.detail)})` : ''}`).join('; ')}.</p>` : ''}
  </section>`
}

// panel/src/inbox.mjs
// The inbox, as pure functions of what the worker's `line.get` answers: what needs the person,
// in the order and the words of the dashboard's What needs you (Jig's dashboard/src/needs-view.ts),
// drawn as HTML text. Nothing here reaches Orca; app.mjs wires it to the frame.

/** The causes a person decides; every other need is one to check. */
const TO_DECIDE = new Set(['parked', 'needs-person', 'stopped-unknown'])

/** Each stage's mark, as the dashboard draws it. */
const STAGES = { pickup: '+', rearm: '↻', takeover: '⇄', followup: '»', notify: '*', steer: '^' }

function recordedWord(need) {
  if (need.cause === 'parked') return 'parked for a person'
  if (need.cause === 'assigner-cannot-write') return 'assigner cannot write'
  return need.cause
}

function goLabel(need) {
  if (need.pr === null) return 'Open in the tracker'
  if (need.cause === 'needs-person') return 'Read the handoff on the pull request'
  if (['followup-failed', 'nudge-unanswered', 'stopped-unknown'].includes(need.cause))
    return 'Open the pull request'
  return 'Answer on the pull request'
}

const byAge = (a, b) => Date.parse(a.since) - Date.parse(b.since)

/** The needs in the dashboard's groups: to decide, then to check, oldest first in each. */
function groups(needs) {
  return [
    { head: 'To decide, on the pull request', needs: needs.filter((n) => TO_DECIDE.has(n.cause)).sort(byAge) },
    { head: 'To check', needs: needs.filter((n) => !TO_DECIDE.has(n.cause)).sort(byAge) }
  ].filter((g) => g.needs.length > 0)
}

/** The decision keys a person answers, once each. */
function answerKeys(need) {
  return [...new Set((need.decisions ?? []).map((d) => d.key))]
}

/** A need's key across reads, for its drafts and its open folds. */
function needKey(need) {
  return `${need.repo} ${need.target} ${need.cause}`
}

/**
 * Enough Markdown for a framed decision: headings, bullets, bold and code. Raw HTML stays text
 * and nothing becomes a link, since the text comes from pull requests.
 */
function markdown(lines) {
  const inline = (s) =>
    esc(s)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
  let html = ''
  let list = false
  for (const line of lines) {
    const bullet = /^\s*[-*] (.*)/.exec(line)
    if (!bullet && list) {
      html += '</ul>'
      list = false
    }
    const heading = /^#{1,6} (.*)/.exec(line)
    if (heading) html += `<h4>${inline(heading[1])}</h4>`
    else if (bullet) {
      if (!list) html += '<ul>'
      list = true
      html += `<li>${inline(bullet[1])}</li>`
    } else if (line.trim()) html += `<p>${inline(line)}</p>`
  }
  return html + (list ? '</ul>' : '')
}

/** The head of the inbox: the line's answer to whether anything needs the person, and its tick. */
function headHtml(answer, nowMs) {
  const { line } = answer
  const needs = line.needs
  const omitted = Number.isInteger(line.omitted) && line.omitted > 0 ? line.omitted : 0
  const total = needs.length + omitted
  const interval = Number.isFinite(line.intervalMs) && line.intervalMs > 0 ? line.intervalMs : null
  const age = nowMs - Date.parse(line.finishedAt)
  const overdue = interval !== null && age > 2 * interval
  let title
  let sub
  if (total > 0) {
    title = total === 1 ? '1 needs a person.' : `${total} need a person.`
  } else {
    title = 'Nothing needs a person.'
  }
  if (needs.length > 0) {
    const ordered = groups(needs).flatMap((g) => g.needs)
    const oldest = Math.min(...needs.map((n) => Date.parse(n.since)))
    sub = `Oldest ${span((nowMs - oldest) / MINUTE_MS)}. First: ${ordered[0].target}, ${recordedWord(ordered[0])}.`
  } else if (omitted > 0) {
    sub = 'None of them fits in the answer.'
  } else {
    sub = `${plural(line.sessions, 'session')} in a slot; ${line.queue > 0 ? `${plural(line.queue, 'item')} queued` : 'queue empty'}.`
  }
  return `<header class="band${total > 0 ? ' loud' : ''}">
    <p class="title">${esc(title)}</p>
    <p class="sm mut">${esc(sub)}</p>${
      omitted > 0
        ? `\n    <p class="sm warn" role="alert">${esc(`${omitted} of ${total} needs are left out because the line is too large to show; read them with jig dispatch dashboard or jig dispatch line --json.`)}</p>`
        : ''
    }
    <p class="sm tick${overdue ? ' overdue' : ' mut'}" title="${esc(`Tick ${line.runId}, finished ${line.finishedAt}`)}">${
      overdue
        ? `Tick overdue: the newest finished ${esc(ago(line.finishedAt, nowMs))} ago, past twice the ${esc(span(interval / MINUTE_MS))} interval.`
        : `Tick finished ${esc(ago(line.finishedAt, nowMs))} ago.`
    }</p>
  </header>`
}

function decisionHtml(need, decision, open) {
  const lines = Array.isArray(decision.lines) ? decision.lines : []
  const named = decision.decisionClass ? `${decision.decisionClass}, ` : ''
  return `<details class="decision" data-fold="${esc(`${needKey(need)}\n${decision.key}`)}"${open ? ' open' : ''}>
    <summary><span class="q">${esc(decision.question ?? `Decision ${decision.key}`)}</span>
      <span class="sm mut"> ${esc(named)}${esc(decision.kind)} <span class="m">${esc(decision.key)}</span></span></summary>
    ${lines.length > 0 ? `<div class="md">${markdown(lines)}</div>` : '<p class="sm mut">The drive framed no question for this decision.</p>'}
  </details>`
}

/** A park's questions, each key once, with the question its first decision under that key frames. */
function needQuestions(need) {
  return answerKeys(need).map((key) => ({
    key,
    question: (need.decisions ?? []).find((d) => d.key === key)?.question ?? null
  }))
}

/**
 * One need as the inbox draws it. `drafts` and `sends` are the answer boxes' (answer.mjs), and
 * `replying` the keys of the needs whose answer boxes are open. The `first` need, the one the
 * head names, opens its first decision.
 */
function needHtml(
  need,
  nowMs,
  { drafts = new Map(), sends = new Map(), replying = new Set(), first: isFirst = false } = {}
) {
  // A park's decisions carry its questions and recommendations; any other need says its reason.
  const first = need.decisions?.[0]
  const mark = STAGES[need.stage] ?? ''
  const url = openableUrl(need.url)
  const address = typeof need.address === 'string' && need.address !== '' ? need.address : null
  // An answer goes to the drive's address; a park the line names no address for has no box.
  const keys = address === null ? [] : answerKeys(need)
  const drafted = keys.some((k) => (drafts.get(boxKey(address, k)) ?? '').trim() !== '' || sends.has(boxKey(address, k)))
  const writing = replying.has(needKey(need))
  const open = Array.isArray(need.open) ? need.open : []
  const workspaceButtons = open
    .map(
      (path) =>
        `<button type="button" data-open-workspace="${esc(path)}" title="${esc(path)}">${
          open.length > 1 ? `Open ${esc(path.split('/').filter(Boolean).pop())}` : 'Open the workspace'
        }</button>`
    )
    .join('')
  return `<article class="need" data-need="${esc(needKey(need))}">
    <div class="rowTop"><span class="dot"></span><span class="tgt">${esc(need.target)}</span>
      <span class="m sm mut end">${esc(ago(need.since, nowMs))}</span></div>
    <div class="sm"><span class="m mut">${esc(need.repo)}</span> <span class="stage" title="${esc(need.stage)}">${esc(mark ? `${mark} ${need.stage}` : need.stage)}</span></div>
    ${need.title ? `<div class="sm ttl">${esc(need.title)}</div>` : ''}
    <div class="sm"><span class="m">${esc(recordedWord(need))}</span><span class="mut">${
      first ? esc(`${first.decisionClass ? `, class ${first.decisionClass}` : ''}, ${first.kind}`) : ''
    }</span>${keys.length > 1 ? ` <b>· ${keys.length} to answer</b>` : ''}</div>
    ${first ? '' : `<p class="q">${esc(need.reason)}</p>`}
    <div class="acts">
      ${url ? `<button type="button" class="primary" data-open-url="${esc(url)}">${esc(goLabel(need))} ↗</button>` : ''}
      ${!url && need.url === null ? `<span class="sm mut">No tracker link: look up ${esc(need.target)} in the tracker.</span>` : ''}
      ${keys.length > 0 ? `<button type="button" aria-expanded="${writing}" data-reply="${esc(needKey(need))}">${writing ? 'Hide answer' : drafted ? 'Your answer' : 'Answer here'}</button>` : ''}
      ${address ? `<button type="button" class="ghost" data-open-address="${esc(address)}">Thread</button>` : ''}
      ${workspaceButtons}
    </div>
    ${keys.length > 0 && writing ? answerBoxesHtml(address, needQuestions(need), { drafts, sends }) : ''}
    ${(need.decisions ?? []).length > 0 ? `<div class="decisions">${need.decisions.map((d, i) => decisionHtml(need, d, isFirst && i === 0)).join('')}</div>` : ''}
    <details class="fold" data-fold="${esc(`${needKey(need)}\ndetails`)}"><summary class="sm">Details</summary>
      <dl class="kv sm">
        <dt>since</dt><dd class="m">${esc(need.since)}</dd>
        ${first ? `<dt>reason</dt><dd>${esc(need.reason)}</dd>` : ''}
        ${need.url ? `<dt>link</dt><dd class="m">${esc(need.url)}</dd>` : ''}
        ${need.notified ? `<dt>notified</dt><dd>${esc(need.notified.at ? `${need.notified.at}, to its workspace` : need.notified.outcome)}</dd>` : ''}
        ${(need.workspaces ?? []).map((p, i) => `<dt>workspace ${i + 1}</dt><dd class="m">${esc(p)}</dd>`).join('')}
      </dl>
    </details>
  </article>`
}

/** The whole panel for one `line.get` answer. */
function panelHtml(answer, { nowMs, drafts = new Map(), sends = new Map(), replying = new Set(), note = null } = {}) {
  const noteHtml = note ? `<div class="note sm" role="status">${esc(note)}</div>` : ''
  if (answer.state === 'no-tick')
    return `${noteHtml}<div class="empty"><b>No tick has run on this host.</b><p class="sm mut">The timer writes the first line at its first tick.</p></div>`
  if (answer.state === 'too-old')
    return `${noteHtml}<div class="empty"><b>This jig is too old for the panel.</b><p class="sm mut">It has no <span class="m">jig dispatch line</span>; update the jig plugin to see the line here.</p></div>`
  if (answer.state === 'not-found')
    return `${noteHtml}<div class="empty bad"><b>Jig not found.</b><p class="sm">${esc(answer.why)}</p></div>`
  if (answer.state !== 'line')
    return `${noteHtml}<div class="empty bad"><b>The line could not be read.</b><p class="sm">${esc(answer.why ?? 'no reason was given.')}</p></div>`
  const ordered = groups(answer.line.needs)
  const lead = ordered[0]?.needs[0]
  const body = ordered
    .map(
      (g) => `<section class="group"><h2 class="groupHead">${esc(g.head)} <span class="mut">${g.needs.length}</span></h2>${g.needs
        .map((n) => needHtml(n, nowMs, { drafts, sends, replying, first: n === lead }))
        .join('')}</section>`
    )
    .join('')
  return `${headHtml(answer, nowMs)}${noteHtml}${body}`
}

// panel/src/app.mjs
// The panel in Orca's frame: asks the worker for the line and the addresses, draws the inbox,
// the address list and a thread, and answers their buttons. The pull request opens through
// `orca.shell.openExternal`, which needs the click; the workspace opens through the worker; an
// answer is sent by the worker through `jig send`, and shown as sent only once it says so.
// Drafts live only in this page, so the panel stores nothing.

/** How often the open panel reads again when no tick told it to. */
const POLL_MS = 60_000
/** The worker's read may run 30 s; the request waits a little longer. */
const REQUEST_TIMEOUT_MS = 45_000
/** One `jig ask` or `jig send` may run 50 s, and wait for one before it; Orca allows 120 s. */
const ADDRESS_TIMEOUT_MS = 110_000

const orca = window.orca
const app = document.getElementById('app')

const view = {
  /** `inbox`, `addresses` or `thread`. */
  tab: 'inbox',
  answer: null,
  /** `performance.now()` at the read, so the line's clock moves on with this page's. */
  readAt: 0,
  list: null,
  thread: null,
  /** The address the thread view shows, and whether all of its thread was asked for. */
  address: null,
  all: false,
  drafts: new Map(),
  /** Each answer box's step, by `boxKey`: review, sending, sent or failed. */
  sends: new Map(),
  replying: new Set(),
  folds: new Map(),
  note: null,
  pending: false
}

const request = (name, input, timeoutMs = REQUEST_TIMEOUT_MS) => orca.plugin.request(name, input, { timeoutMs })

const workerSilent = (error) => `the worker did not answer (${error?.code ?? 'error'}: ${error?.message ?? error}).`

function nowMs() {
  const said = Date.parse(view.answer?.now ?? '')
  return Number.isFinite(said) ? said + (performance.now() - view.readAt) : Date.now()
}

function bodyHtml() {
  const options = { nowMs: nowMs(), drafts: view.drafts, sends: view.sends, note: view.note }
  if (view.tab === 'addresses')
    return view.list ? addressListHtml(view.list, options) : '<p class="sm mut pad">Reading the addresses…</p>'
  if (view.tab === 'thread')
    return view.thread && view.thread.address === view.address
      ? threadHtml(view.thread, options)
      : `<p class="sm mut pad">Reading the thread of <span class="m">${esc(view.address)}</span>…</p>`
  return view.answer ? panelHtml(view.answer, { ...options, replying: view.replying }) : '<p class="sm mut pad">Reading the line…</p>'
}

function render() {
  // A redraw would take the cursor out of an answer being typed; it waits for the box to lose focus.
  if (document.activeElement?.tagName === 'TEXTAREA' && app.contains(document.activeElement)) {
    view.pending = true
    return
  }
  view.pending = false
  for (const tab of document.querySelectorAll('.bar [data-tab]'))
    tab.setAttribute('aria-pressed', String(tab.dataset.tab === (view.tab === 'thread' ? 'addresses' : view.tab)))
  for (const fold of app.querySelectorAll('details[data-fold]')) view.folds.set(fold.dataset.fold, fold.open)
  app.innerHTML = bodyHtml()
  for (const fold of app.querySelectorAll('details[data-fold]'))
    if (view.folds.has(fold.dataset.fold)) fold.open = view.folds.get(fold.dataset.fold)
}

async function loadLine(fresh = false) {
  try {
    view.answer = await request('line.get', fresh ? { fresh: true } : {})
    view.readAt = performance.now()
    if (view.tab === 'thread' && view.address) loadThread(view.address)
  } catch (error) {
    view.answer = { state: 'unreadable', why: workerSilent(error) }
  }
  render()
}

async function loadList(fresh = false) {
  try {
    view.list = await request('addresses.list', fresh ? { fresh: true } : {}, ADDRESS_TIMEOUT_MS)
  } catch (error) {
    view.list = { state: 'unreadable', why: workerSilent(error), addresses: [] }
  }
  render()
}

let threadRead = 0
async function loadThread(address) {
  const generation = ++threadRead
  const all = view.all
  let answer
  try {
    answer = await request('address.get', { address, all }, ADDRESS_TIMEOUT_MS)
  } catch (error) {
    answer = { state: 'unreadable', why: workerSilent(error), address }
  }
  // A thread asked for before the person moved on is not drawn over the one they opened.
  if (view.address !== address || view.all !== all || threadRead !== generation) return
  view.thread = answer
  render()
}

function show(tab) {
  view.tab = tab
  view.note = null
  render()
  if (tab === 'addresses') loadList()
  if (tab === 'inbox') loadLine()
}

function openAddress(address) {
  view.tab = 'thread'
  view.address = address
  view.all = false
  view.thread = null
  view.note = null
  render()
  loadThread(address)
}

/** Copies `text` the one way a frame allows: `execCommand` inside the click. */
function copy(text) {
  const area = Object.assign(document.createElement('textarea'), { value: text })
  area.setAttribute('readonly', '')
  area.style.position = 'fixed'
  area.style.opacity = '0'
  document.body.append(area)
  area.select()
  let done = false
  try {
    done = document.execCommand('copy')
  } catch {
    done = false
  }
  area.remove()
  return done
}

function say(note) {
  view.note = note
  render()
}

/** The review, send and edit steps of one answer box. */
function answerStep(step, address, key) {
  const k = boxKey(address, key)
  if (step === 'edit') {
    view.sends.delete(k)
    return render()
  }
  if (step === 'review') {
    const text = (view.drafts.get(k) ?? '').trim()
    if (text === '') return say('Write the answer first.')
    view.sends.set(k, { stage: 'review', text })
    return render()
  }
  const send = view.sends.get(k)
  if (step !== 'send' || send?.stage !== 'review') return
  view.sends.set(k, { stage: 'sending', text: send.text })
  render()
  request('address.send', { address, verb: 'answer', key, text: send.text }, ADDRESS_TIMEOUT_MS)
    .then((result) => {
      view.sends.set(k, { stage: result?.sent === true ? 'sent' : 'failed', text: send.text, result })
      if (result?.sent === true) view.drafts.delete(k)
    })
    .catch((error) =>
      view.sends.set(k, {
        stage: 'failed',
        text: send.text,
        result: { unknown: true, why: `${workerSilent(error)} Whether it was sent is not known: read the pull request before sending again.` }
      })
    )
    .finally(render)
}

app.addEventListener('input', (event) => {
  const key = event.target?.dataset?.draft
  if (key !== undefined) view.drafts.set(key, event.target.value)
})

app.addEventListener('focusout', () => {
  if (view.pending) setTimeout(render, 0)
})

app.addEventListener('click', (event) => {
  const button = event.target.closest('button')
  if (!button || !app.contains(button)) return
  const d = button.dataset
  if (d.openUrl !== undefined) {
    const url = openableUrl(d.openUrl)
    if (!url) return say('Only an https link from the line opens.')
    // Called inside the click: Orca opens a link only on the person's own press.
    if (orca.shell?.openExternal)
      orca.shell
        .openExternal(url)
        .then((r) => (r?.opened === false ? say('Not opened.') : undefined))
        .catch((error) => say(`Orca did not open the link: ${error?.message ?? error}`))
    else say(copy(url) ? 'This Orca client opens no links from a panel; the link is copied.' : `Open ${url}`)
    return
  }
  if (d.answer !== undefined) return answerStep(d.answer, d.address, d.key)
  if (d.openAddress !== undefined) return openAddress(d.openAddress)
  if (d.tab !== undefined) return show(d.tab)
  if (d.threadAll !== undefined) {
    view.all = true
    view.thread = null
    render()
    return loadThread(d.threadAll)
  }
  if (d.reply !== undefined) {
    if (view.replying.has(d.reply)) view.replying.delete(d.reply)
    else view.replying.add(d.reply)
    return render()
  }
  if (d.openWorkspace !== undefined) {
    request('workspace.open', { path: d.openWorkspace })
      .then((r) => say(r?.opened ? null : `Not opened: ${r?.why ?? 'no reason was given.'}`))
      .catch((error) => say(`Not opened: ${error?.message ?? error}`))
  }
})

for (const tab of document.querySelectorAll('.bar [data-tab]')) tab.addEventListener('click', () => show(tab.dataset.tab))

document.getElementById('refresh')?.addEventListener('click', () => {
  view.note = null
  if (view.tab === 'addresses') return loadList(true)
  if (view.tab === 'thread') {
    view.thread = null
    render()
    return loadThread(view.address)
  }
  loadLine(true)
})

// The line keeps the inbox, the answer boxes' questions and the ages current; the list follows it.
orca.plugin.on?.('line.changed', () => {
  loadLine()
  if (view.tab === 'addresses') loadList()
})
setInterval(() => loadLine(), POLL_MS)
render()
loadLine()
    </script>
  </body>
</html>
